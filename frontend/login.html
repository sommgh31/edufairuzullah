<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Edu Fairuzullah LMS</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-container">
    <h2>🎓 Edu Fairuzullah</h2>
    <h3 style="text-align: center; color: #666; margin-bottom: 30px;">
        Login to Your Account
    </h3>

    <div id="message"></div>

    <!-- IMPORTANT: novalidate + no action -->
    <form id="loginForm" novalidate>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" required autocomplete="email" />
        </div>

        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit">Login</button>
    </form>

    <div class="auth-links">
        <p>
            Don’t have an account?
            <a href="register.html">Register here</a>
        </p>
    </div>
</div>

<!-- NON-MODULE SCRIPT -->
<script src="js/utils.js"></script>

<!-- MODULE SCRIPT (ONLY ONE BLOCK) -->
<script type="module">
    import "./js/firebase-init.js";
    import { login, isAuthenticated, getCurrentUser, logout } from "./js/auth.js";

    const form = document.getElementById("loginForm");

    // ===== AUTO REDIRECT IF ALREADY LOGGED IN =====
    if (isAuthenticated()) {
        redirectByRole(getCurrentUser());
    }

    // ===== LOGIN HANDLER =====
    form.addEventListener("submit", async (e) => {
        e.preventDefault(); // 🚨 REQUIRED

        const email = form.email.value.trim();
        const password = form.password.value;

        if (!email || !password) {
            showMessage("Email and password are required", "error");
            return;
        }

        const result = await login(email, password);

        if (result.success) {
            showMessage("Login successful! Redirecting...", "success");
            setTimeout(() => redirectByRole(result.user), 600);
        } else {
            showMessage(result.error || "Login failed", "error");
        }
    });

    function redirectByRole(user) {
        if (!user || !user.role) {
            logout();
            return;
        }

        if (user.role === "educator") {
            window.location.href = "educator-dashboard.html";
        } else if (user.role === "learner") {
            window.location.href = "learner-dashboard.html";
        } else {
            window.location.href = "login.html";
        }
    }
</script>

</body>
</html>
