<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Edu Fairuzullah LMS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-container">
    <h2>🎓 Edu Fairuzullah</h2>
    <h3 style="text-align: center; color: #666; margin-bottom: 30px;">
        Create Your Account
    </h3>

    <div id="message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" required autocomplete="name">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Role:</label>
            <select name="role" required>
                <option value="">Select Role</option>
                <option value="educator">Educator</option>
                <option value="learner">Learner</option>
            </select>
        </div>
        <button type="submit">Register</button>
    </form>

    <div class="auth-links">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>

<!-- Normal scripts (NO Firebase imports inside these) -->
<script src="js/utils.js"></script>
<script src="js/api.js"></script>

<!-- Firebase + Auth (MODULES ONLY) -->
<script type="module" src="js/firebase-init.js"></script>
<script type="module" src="js/auth.js"></script>

<script type="module">
    import { register, isAuthenticated, getCurrentUser, logout } from './js/auth.js';

    // ===== AUTO REDIRECT IF ALREADY LOGGED IN =====
    if (isAuthenticated()) {
        const user = getCurrentUser();
        redirectByRole(user);
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const name = formData.get('name').trim();
        const email = formData.get('email').trim();
        const password = formData.get('password');
        const role = formData.get('role');

        if (!name || !email || !password || !role) {
            showMessage('All fields are required', 'error');
            return;
        }

        const result = await register(name, email, password, role);

        if (result.success) {
            showMessage('Registration successful! Redirecting...', 'success');
            setTimeout(() => {
                redirectByRole(result.user);
            }, 600);
        } else {
            showMessage(result.error || 'Registration failed', 'error');
        }
    });

    function redirectByRole(user) {
        if (!user || !user.role) {
            logout();
            return;
        }

        if (user.role === 'educator') {
            window.location.href = 'educator-dashboard.html';
        } else if (user.role === 'learner') {
            window.location.href = 'learner-dashboard.html';
        } else {
            window.location.href = 'dashboard.html';
        }
    }
</script>
