<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course - Edu Fairuzullah LMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 Edu Fairuzullah</h1>
        <p>Educator – Create Course</p>
    </header>

    <nav>
        <div class="nav-links">
            <a href="educator-dashboard.html">Dashboard</a>
            <a href="educator-my-courses.html">My Courses</a>
            <a href="#" class="active">Create Course</a>
        </div>
        <div class="user-info">
            <span id="userName"></span>
            <button id="logoutBtn" style="background:#dc3545;">Logout</button>
        </div>
    </nav>

    <div class="content">
        <div id="message"></div>

        <div class="card">
            <h3>Create New Course</h3>

            <div class="form-group">
                <label>Course Title</label>
                <input type="text" id="title" placeholder="Enter course title">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="4"
                          placeholder="Course description"></textarea>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="category" placeholder="e.g. Programming">
            </div>

            <div class="card-actions">
                <button type="button" id="createCourseBtn" class="btn-primary">
                    Create Course
                </button>
                <a href="educator-my-courses.html" class="btn-view">Cancel</a>
            </div>
        </div>
    </div>
</div>

<!-- GLOBAL SCRIPTS (NON-MODULE) -->
<script src="js/utils.js"></script>
<script src="js/api.js"></script>

<!-- AUTH (MODULE) -->
<script type="module" src="js/firebase-init.js"></script>
<script type="module">
    import { isAuthenticated, getCurrentUser, logout } from './js/auth.js';

    console.log('Create Course page loaded');

    // ===== AUTH CHECK =====
    if (!isAuthenticated()) {
        window.location.href = 'login.html';
    }

    const user = getCurrentUser();
    console.log('Current user:', user);

    if (!user || user.role !== 'educator') {
        alert('Access denied');
        logout();
        window.location.href = 'login.html';
    }

    document.getElementById('userName').textContent =
        `${user.name} (${user.role})`;

    document.getElementById('logoutBtn').onclick = () => {
        logout();
        window.location.href = 'login.html';
    };

    // ===== CREATE COURSE =====
    document.getElementById('createCourseBtn').addEventListener('click', async () => {
        console.log('Create course clicked');

        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const category = document.getElementById('category').value.trim();

        if (!title) {
            showMessage('Course title is required', 'error');
            return;
        }

        const courseData = {
            title,
            description,
            category,
            educatorId: user.uid,
            educatorName: user.name,
            enrolledStudents: [],
            createdAt: new Date().toISOString()
        };

        console.log('Sending course:', courseData);

        try {
            // 🔥 GLOBAL FUNCTION FROM api.js
            await createCourse(courseData);

            showMessage('Course created successfully!', 'success');

            setTimeout(() => {
                window.location.href = 'educator-my-courses.html';
            }, 800);

        } catch (err) {
            console.error(err);
            showMessage(err.message || 'Failed to create course', 'error');
        }
    });
</script>

</body>
</html>
